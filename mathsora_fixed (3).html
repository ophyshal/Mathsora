<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mathsora — Every problem, a breakthrough.</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#021B1A;--s1:#042A2B;--s2:#053535;--s3:#074040;--s4:#0A5050;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);--bd3:rgba(255,255,255,0.22);
  --gold:#2EC4B6;--gold2:#80DED9;--gd:rgba(46,196,182,0.10);--gd2:rgba(46,196,182,0.18);
  --teal:#2EC4B6;--td:rgba(46,196,182,0.10);
  --rose:#f96b8b;--rd:rgba(249,107,139,0.10);
  --sky:#5bb4f4;--skd:rgba(91,180,244,0.10);
  --grn:#4fd68a;--gnd:rgba(79,214,138,0.10);
  --vio:#a78bfa;--vd:rgba(167,139,250,0.10);
  --ora:#fb923c;--ord:rgba(251,146,60,0.10);
  --t1:#eef2fc;--t2:rgba(238,242,252,0.68);--t3:rgba(238,242,252,0.40);--t4:rgba(238,242,252,0.16);
  --r:12px;--rs:7px;--font:'Outfit',sans-serif;--serif:'Lora',serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:orbF 8s ease-in-out infinite}
.o1{width:500px;height:500px;top:-180px;right:-80px;background:radial-gradient(circle,rgba(245,200,66,.05),transparent 70%)}
.o2{width:400px;height:400px;bottom:-100px;left:-70px;background:radial-gradient(circle,rgba(45,217,197,.045),transparent 70%);animation-delay:-3s}
.o3{width:280px;height:280px;top:45%;left:42%;background:radial-gradient(circle,rgba(167,139,250,.035),transparent 70%);animation-delay:-6s}
@keyframes orbF{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.06)}}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:300;background:rgba(6,10,18,.92);border-bottom:1px solid var(--bd);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;padding:0;transition:box-shadow .3s}
nav.sc{box-shadow:0 4px 24px rgba(0,0,0,.5)}
.nav-top{display:flex;align-items:center;gap:.85rem;padding:.55rem 1.4rem;height:50px}
.nav-bottom{display:flex;align-items:center;padding:0 1rem .38rem;gap:2px;border-top:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.nav-bottom::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:8px;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;color:var(--t1);white-space:nowrap;flex-shrink:0;cursor:pointer;user-select:none}
.logo-i{width:40px;height:34px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.logo:hover .logo-i{transform:scale(1.1)}
.logo-em{font-family:var(--serif);font-style:italic;color:#2EC4B6}
.nav-pills{display:contents}
.np{background:none;border:none;color:var(--t3);font-family:var(--font);font-size:.82rem;font-weight:500;padding:.28rem .6rem;border-radius:6px;cursor:pointer;transition:all .17s;white-space:nowrap;position:relative;flex-shrink:0}
.np:hover{color:var(--t1);background:var(--bd)}
.np.on{color:var(--t1);background:var(--s3);border:1px solid var(--bd2)}
.np.on::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:10px;height:2px;background:var(--gold);border-radius:2px}
.nav-r{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.nbadge{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd2);padding:.22rem .58rem;border-radius:20px;font-size:.82rem;font-weight:700;cursor:default;transition:transform .2s;user-select:none}
.nbadge:hover{transform:scale(1.05)}
.ng{color:var(--gold)}.nr{color:var(--rose)}
.pd{width:5px;height:5px;border-radius:50%;animation:pdot 2s ease-in-out infinite}
.pg{background:var(--gold)}.pr{background:var(--rose)}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.55)}}

/* ── PAGE ── */
.pw{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1;animation:pgIn .3s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{opacity:0;animation:sgIn .4s ease forwards}
.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.15s}.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.25s}.stagger>*:nth-child(6){animation-delay:.3s}
.stagger>*:nth-child(7){animation-delay:.35s}.stagger>*:nth-child(8){animation-delay:.4s}
@keyframes sgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.3rem;transition:all .22s;position:relative;overflow:hidden}
.card:hover{border-color:var(--bd2);background:var(--s2)}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.card-top{position:absolute;top:0;left:0;right:0;height:2.5px;border-radius:var(--r) var(--r) 0 0}
.card h3{font-size:1rem;font-weight:700;color:var(--t1);line-height:1.4;margin-bottom:.34rem}
.card p{font-size:.88rem;color:var(--t3);line-height:1.85}
.cf{margin-top:.88rem;padding-top:.82rem;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;font-size:.84rem;color:var(--t3)}

/* ── TAGS ── */
.tag{display:inline-block;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;padding:.18rem .52rem;border-radius:4px;margin-bottom:.78rem}
.tg{background:var(--gd);color:var(--gold2)}.tt{background:var(--td);color:var(--teal)}.tr{background:var(--rd);color:var(--rose)}
.ts{background:var(--skd);color:var(--sky)}.tn{background:var(--gnd);color:var(--grn)}.tv{background:var(--vd);color:var(--vio)}
.to{background:var(--ord);color:var(--ora)}
.diff-e{background:var(--gnd);color:var(--grn);font-size:.78rem;font-weight:700;padding:.16rem .45rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.diff-m{background:var(--gd);color:var(--gold2);font-size:.78rem;font-weight:700;padding:.16rem .45rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.diff-h{background:var(--rd);color:var(--rose);font-size:.78rem;font-weight:700;padding:.16rem .45rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}

/* ── EXAM TYPE CHIPS ── */
.exam-chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.18rem .55rem;border-radius:20px;border:1px solid}
.ec-gcse{background:rgba(45,217,197,.1);color:var(--teal);border-color:rgba(45,217,197,.25)}
.ec-al{background:rgba(245,200,66,.1);color:var(--gold2);border-color:rgba(245,200,66,.25)}
.ec-fm{background:rgba(167,139,250,.1);color:var(--vio);border-color:rgba(167,139,250,.25)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--rs);font-family:var(--font);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:active{transform:scale(.97)!important}
.btn-gold{background:var(--gold);color:#080500;padding:.68rem 1.45rem}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(245,200,66,.28)}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--bd2);padding:.68rem 1.45rem}
.btn-ghost:hover{color:var(--t1);border-color:var(--bd3);background:var(--s3)}
.btn-teal{background:var(--td);color:var(--teal);border:1px solid rgba(45,217,197,.2);padding:.5rem 1.1rem}
.btn-teal:hover{background:rgba(45,217,197,.18)}
.btn-rose{background:var(--rd);color:var(--rose);border:1px solid rgba(249,107,139,.2);padding:.5rem 1.1rem}
.btn-vio{background:var(--vd);color:var(--vio);border:1px solid rgba(167,139,250,.2);padding:.5rem 1.1rem}
.btn-vio:hover{background:rgba(167,139,250,.18)}
.btn-sm{padding:.4rem .95rem;font-size:.84rem;border-radius:6px}

/* ── SECTION HEADER ── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.15rem}
.sh h2{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.sh-a{font-size:.88rem;font-weight:600;color:var(--gold);cursor:pointer;background:none;border:none;font-family:var(--font);opacity:.85}
.sh-a:hover{opacity:1}

/* ── GRIDS ── */
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── INPUTS ── */
.fi{background:var(--s2);border:1px solid var(--bd);border-radius:var(--rs);padding:.55rem .78rem;font-family:var(--font);font-size:.95rem;color:var(--t1);outline:none;transition:border .18s,box-shadow .18s;width:100%}
.fi:focus{border-color:rgba(245,200,66,.5);box-shadow:0 0 0 3px rgba(245,200,66,.07)}
.fi::placeholder{color:var(--t4)}
.fi option{background:var(--s2)}
select.fi{-webkit-appearance:none;cursor:pointer}
textarea.fi{resize:vertical;min-height:70px}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--t3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:11px}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.3rem}
.fb{background:transparent;border:1px solid var(--bd);border-radius:6px;padding:.26rem .75rem;font-family:var(--font);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .17s;color:var(--t3)}
.fb:hover{color:var(--t1);border-color:var(--bd2)}
.fb.on{background:var(--gold);color:#0a0800;border-color:var(--gold);font-weight:700}
.fb.on-teal{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
.fb.on-vio{background:var(--vio);color:#000;border-color:var(--vio);font-weight:700}

/* ── EXAM TYPE SELECTOR (big tabs) ── */
.exam-tabs{display:flex;gap:8px;margin-bottom:1.5rem}
.et{flex:1;background:var(--s1);border:2px solid var(--bd);border-radius:var(--r);padding:1rem 1.2rem;cursor:pointer;transition:all .22s;text-align:left}
.et:hover{border-color:var(--bd2);background:var(--s2)}
.et.on-gcse{border-color:var(--teal);background:rgba(45,217,197,.06)}
.et.on-al{border-color:var(--gold);background:var(--gd)}
.et.on-fm{border-color:var(--vio);background:var(--vd)}
.et-badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.2rem .55rem;border-radius:4px;display:inline-block;margin-bottom:.5rem}
.et-title{font-size:1rem;font-weight:700;color:var(--t1)}
.et-sub{font-size:.82rem;color:var(--t3);margin-top:3px}
.et-count{font-family:var(--mono);font-size:.78rem;color:var(--t3);margin-top:.5rem}

/* ── QUESTION BANK LAYOUT ── */
.qwrap{display:grid;grid-template-columns:220px 1fr;gap:1.4rem;align-items:start}
.qsidebar{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;position:sticky;top:94px}
.qs-h{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:.65rem}
.qs-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.qi{display:flex;align-items:center;justify-content:space-between;padding:.42rem .65rem;border-radius:6px;font-size:.92rem;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s}
.qi:hover{background:var(--s2);color:var(--t1)}
.qi.on{background:var(--gd2);color:var(--gold2);font-weight:700}
.qi.on-t{background:var(--td);color:var(--teal);font-weight:700}
.qi.on-v{background:var(--vd);color:var(--vio);font-weight:700}
.qcount{font-size:.72rem;background:var(--bd);padding:.1rem .4rem;border-radius:10px;font-family:var(--mono)}

/* Question cards */
.qcard{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.15rem;margin-bottom:8px;cursor:pointer;transition:all .2s}
.qcard:hover{border-color:var(--bd2);background:var(--s2)}
.qcard.open{border-color:rgba(245,200,66,.35);background:var(--s2)}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.qtext{font-size:.95rem;line-height:1.9;flex:1;font-weight:500;color:var(--t2)}
.qtext strong{color:var(--t1)}
.qmeta{display:flex;gap:6px;align-items:center;flex-shrink:0}
.qmarks{font-size:.82rem;color:var(--t3);font-family:var(--mono)}
.qsol{display:none;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--bd)}
.qcard.open .qsol{display:block;animation:solIn .28s ease}
@keyframes solIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.sol-box{background:var(--s3);border:1px solid rgba(45,217,197,.15);border-radius:var(--rs);padding:.95rem 1.1rem;font-size:.88rem;line-height:1.9;color:#aae4de;font-family:var(--mono)}
.sol-box strong{color:var(--teal)}
.sol-meta{font-size:.76rem;color:var(--t3);margin-top:.5rem}
.mcq-wrap{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:1.3rem;margin-top:.85rem}
.mcq-q{font-size:.95rem;font-weight:600;color:var(--t1);margin-bottom:.9rem;line-height:1.85}
.mcq-opts{display:flex;flex-direction:column;gap:5px}
.mcq-o{background:var(--s3);border:1px solid var(--bd);border-radius:var(--rs);padding:.55rem .85rem;font-size:.88rem;font-weight:500;color:var(--t2);cursor:pointer;transition:all .17s;display:flex;align-items:center;gap:.68rem;text-align:left;font-family:var(--font)}
.mcq-o:hover{border-color:var(--bd2);color:var(--t1);background:var(--s4);transform:translateX(3px)}
.mcq-o.ok{border-color:var(--grn);background:var(--gnd);color:var(--grn)}
.mcq-o.no{border-color:var(--rose);background:var(--rd);color:var(--rose)}
.opt-l{width:20px;height:20px;border-radius:50%;background:var(--bd2);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;font-family:var(--mono);flex-shrink:0}
.mcq-fb{display:none;margin-top:.72rem;padding:.62rem .9rem;border-radius:var(--rs);font-size:.88rem;font-weight:500}
.fb-ok{background:var(--gnd);border:1px solid rgba(79,214,138,.2);color:var(--grn)}
.fb-no{background:var(--rd);border:1px solid rgba(249,107,139,.2);color:var(--rose)}
.quiz-bar{background:var(--s1);border:1px solid rgba(245,200,66,.18);border-radius:var(--r);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.05rem}
.qb-l{display:flex;align-items:center;gap:.68rem}
.qb-ico{width:32px;height:32px;background:var(--gd2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.qb-t{font-size:.97rem;font-weight:700;color:var(--gold2)}
.qb-s{font-size:.84rem;color:var(--t3);margin-top:1px}

/* ── PAPERS ── */
.paper-row{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rs);padding:.92rem 1.15rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;transition:all .2s}
.paper-row:hover{border-color:var(--bd2);background:var(--s2);transform:translateX(3px)}
.bp{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex-shrink:0}
.bp-aqa{background:var(--rd);color:var(--rose)}.bp-edx{background:var(--td);color:var(--teal)}.bp-ocr{background:var(--skd);color:var(--sky)}
.pri h4{font-size:.99rem;font-weight:600;color:var(--t1)}
.pri p{font-size:.84rem;color:var(--t3);margin-top:2px}
.pacts{display:flex;gap:4px;flex-shrink:0}
.pa{font-size:.88rem;padding:.3rem .72rem;border-radius:5px;border:1px solid var(--bd);background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font);font-weight:500;transition:all .17s}
.pa:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.pa.ms{border-color:rgba(45,217,197,.2);color:var(--teal)}
.pa.ms:hover{background:var(--teal);color:#000;border-color:var(--teal)}
.yr-d{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);padding:.88rem 0 .38rem}

/* ── VIDEO CARDS ── */
.vid-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .22s}
.vid-card:hover{border-color:var(--bd2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.vthumb{height:124px;display:flex;align-items:center;justify-content:center;position:relative}
.vplay{width:44px;height:44px;border:2px solid rgba(255,255,255,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .22s}
.vid-card:hover .vplay{background:var(--gold);border-color:var(--gold);transform:scale(1.1)}
.vtri{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid white;margin-left:2px}
.vid-card:hover .vtri{border-left-color:#000}
.vtag{position:absolute;top:8px;left:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;padding:.14rem .42rem;border-radius:4px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.1);color:var(--t1)}
.vbody{padding:.85rem}
.vbody h4{font-size:.92rem;font-weight:600;color:var(--t1);line-height:1.38;margin-bottom:.3rem}
.vmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--t3)}
.vdur{color:var(--teal);font-family:var(--mono);font-size:.82rem}

/* ── HERO ── */
.hero{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:3.4rem 3rem;margin-bottom:1.75rem;position:relative;overflow:hidden}
.hero-g1{position:absolute;top:-80px;right:-60px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(245,200,66,.055) 0%,transparent 65%);pointer-events:none}
.hero-g2{position:absolute;bottom:-60px;left:-40px;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,rgba(45,217,197,.045) 0%,transparent 65%);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1fr 330px;gap:3rem;align-items:center}
.hero-ey{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(245,200,66,.28);background:rgba(245,200,66,.05);border-radius:20px;padding:.24rem .72rem;font-size:.78rem;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.3rem}
.hero h1{font-size:3rem;font-weight:900;line-height:1.05;letter-spacing:-.04em;margin-bottom:.95rem}
.hero h1 em{font-family:var(--serif);font-style:italic;color:var(--gold);font-weight:400}
.hero-sub{font-size:.97rem;color:var(--t2);line-height:1.85;max-width:475px;margin-bottom:1.6rem}
.hero-btns{display:flex;gap:.65rem;flex-wrap:wrap}

.step-num{width:20px;height:20px;border-radius:50%;background:rgba(45,217,197,.15);border:1px solid rgba(45,217,197,.3);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:var(--teal);flex-shrink:0;margin-top:1px}
.step-text{font-size:.88rem;line-height:1.9;color:#aae4de;font-family:var(--mono);flex:1}
.step-text strong{color:var(--teal)}
.step-text em{color:var(--gold2);font-style:normal}
.q-vid-link{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:600;color:var(--sky);background:var(--skd);border:1px solid rgba(91,180,244,.2);padding:.22rem .6rem;border-radius:4px;cursor:pointer;margin-top:.6rem;transition:all .15s}
.q-vid-link:hover{background:rgba(91,180,244,.18);color:var(--t1)}

/* ── PROGRESS HISTORY ── */
.prog-hist{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-top:1.4rem;overflow:hidden}
.ph-head{background:var(--s2);padding:.85rem 1.2rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ph-head h3{font-size:.92rem;font-weight:700}
.ph-timeline{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.6rem}
.ph-entry{display:flex;gap:.85rem;align-items:flex-start;font-size:.8rem}
.ph-dot-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
.ph-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ph-line{width:1px;background:var(--bd);flex:1;min-height:20px}
.ph-content{flex:1;padding-bottom:.55rem;border-bottom:1px solid var(--bd)}
.ph-entry:last-child .ph-content{border:none}
.ph-date{font-size:.78rem;color:var(--t3);font-family:var(--mono);margin-bottom:2px}
.ph-text{color:var(--t2);font-weight:500;font-size:.9rem}
.ph-score{font-size:.8rem;color:var(--t3);margin-top:2px}

/* ── USER ACCOUNTS ── */
.user-card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:2rem;margin-bottom:1.4rem}
.ua-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--teal));display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:800;color:#000;flex-shrink:0}
.ua-info h3{font-size:1.2rem;font-weight:700;margin-bottom:.25rem}
.ua-info p{font-size:.85rem;color:var(--t3)}
.ua-stat{background:var(--s2);border:1px solid var(--bd);border-radius:var(--rs);padding:.75rem;text-align:center}
.ua-stat-n{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.ua-stat-l{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);font-weight:700;margin-top:2px}
.spr-info h4{font-size:.95rem;font-weight:600;color:var(--t1)}
.spr-info p{font-size:.8rem;color:var(--t3);margin-top:2px}
.spr-prog{display:flex;align-items:center;gap:.6rem;font-size:.82rem;color:var(--t3)}
.spr-bar{width:80px;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.spr-fill{height:100%;border-radius:2px}

/* ── RESPONSIVE / MOBILE ── */
@media (max-width:900px){
  .nav-pills{display:none}
  .hero-in{grid-template-columns:1fr}
  .hstats{display:none}
  .qwrap{grid-template-columns:1fr}
  .qsidebar{position:static}
  .upload-layout{grid-template-columns:1fr}
  .upload-sidebar{display:none}
  .admin-layout{grid-template-columns:1fr}
  .asidebar{position:static;display:flex;gap:4px;flex-wrap:wrap;padding:.6rem}
  .asi{font-size:.84rem;padding:.35rem .6rem}
  .data-grid{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .exam-tabs{flex-wrap:wrap}
  .et{min-width:calc(50% - 4px)}
  .pw{padding:1.2rem 1rem}
  .hero{padding:2rem 1.5rem}
  .hero h1{font-size:2.2rem}
}
@media (max-width:640px){
  .g4,.g3{grid-template-columns:1fr}
  .dstrip{grid-template-columns:1fr 1fr}
  .st-row{grid-template-columns:1fr 1fr}
  .fbar{gap:4px}
  .fb{font-size:.82rem;padding:.28rem .75rem}
  .pacts{flex-wrap:wrap;gap:3px}
  .pa{font-size:.78rem;padding:.3rem .68rem}
  .hero-btns{flex-direction:column}
  .hero h1{font-size:1.9rem}
  .hero{padding:1.5rem 1rem}
  .shop-cats{flex-wrap:wrap}
  .scat{min-width:calc(50% - 4px)}
  nav{padding:0 .85rem;gap:.6rem}
  .logo{font-size:1.05rem}
  .nav-r{gap:4px}
  .nbadge{font-size:.78rem;padding:.22rem .55rem}
  .mr-grid{grid-template-columns:repeat(4,1fr)}
  .frow,.frow3{grid-template-columns:1fr}
  .dl-hero{flex-direction:column}
  .plan-top{flex-direction:column;gap:.6rem;align-items:flex-start}
  .quiz-bar{flex-direction:column;gap:.6rem;align-items:flex-start}
}
@media (max-width:400px){
  .dstrip{grid-template-columns:1fr}
  .st-row{grid-template-columns:1fr 1fr}
  .mr-grid{grid-template-columns:repeat(3,1fr)}
  .exam-tabs{flex-direction:column}
  .et{min-width:100%}
}
/* Mobile nav hamburger */
.mob-nav{display:none}
@media(max-width:900px){
  .mob-nav{display:flex;gap:3px}
  .mob-btn{background:none;border:none;color:var(--t2);font-family:var(--font);font-size:.97rem;font-weight:600;padding:.32rem .62rem;border-radius:5px;cursor:pointer;transition:all .17s;white-space:nowrap}
  .mob-btn:hover{color:var(--t1);background:var(--bd)}
  .mob-btn.on{color:var(--gold);background:var(--gd)}
}

/* ── LIGHT THEME OVERRIDE ── */
body.light{
  --bg:#F0FAFA;--s1:#ffffff;--s2:#E8F8F7;--s3:#d0f0ee;--s4:#b8e8e5;
  --bd:rgba(0,0,0,0.08);--bd2:rgba(0,0,0,0.14);--bd3:rgba(0,0,0,0.22);
  --t1:#0f1624;--t2:rgba(15,22,36,0.72);--t3:rgba(15,22,36,0.45);--t4:rgba(15,22,36,0.2);
}
body.light nav{background:rgba(244,246,251,.96)}
body.light .orb{opacity:.4}

/* ── THEME TOGGLE ── */
.theme-btn{background:var(--s2);border:1px solid var(--bd2);color:var(--t2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;transition:all .2s;flex-shrink:0}
.theme-btn:hover{background:var(--s3);transform:rotate(20deg)}

/* ── FLASHCARDS ── */
.flashcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:1.5rem}
.fc-wrap{perspective:900px;height:190px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc-wrap.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:var(--r);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-front{background:var(--s1)}
.fc-back{background:var(--s2);transform:rotateY(180deg)}
.fc-front:hover{border-color:var(--bd2)}
.fc-q{font-size:.92rem;font-weight:600;color:var(--t1);text-align:center;line-height:1.85}
.fc-a{font-size:.88rem;color:var(--teal);text-align:center;line-height:1.85;font-family:var(--mono)}
.fc-hint{font-size:.75rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-top:.6rem;font-weight:600}
.fc-exam{position:absolute;top:10px;left:10px}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1.5rem;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:.85rem 1.25rem}
.fc-stat{font-size:.95rem;font-weight:600;color:var(--t2)}
.fc-stat span{color:var(--gold);font-family:var(--mono)}
.fc-prog-bar{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin:0 .75rem}
.fc-prog-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease}

/* ── MOCK EXAM TIMER ── */
.timer-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.75rem;margin-bottom:1.25rem;text-align:center}
.timer-display{font-family:var(--mono);font-size:4rem;font-weight:700;letter-spacing:.05em;color:var(--t1);margin:1rem 0;transition:color .3s}
.timer-display.warn{color:var(--rose);animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.6}}
.timer-controls{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.exam-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:1.5rem}
.exam-sel-card{background:var(--s1);border:2px solid var(--bd);border-radius:var(--r);padding:1.1rem;cursor:pointer;transition:all .2s;text-align:left}
.exam-sel-card:hover{border-color:var(--bd2);transform:translateY(-1px)}
.exam-sel-card.picked{border-color:var(--gold);background:var(--gd)}
.exam-sel-title{font-size:.92rem;font-weight:700;margin-bottom:.25rem}
.exam-sel-meta{font-size:.85rem;color:var(--t3)}
.timer-q-list{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tql-head{background:var(--s2);padding:.75rem 1.1rem;font-size:.88rem;font-weight:700;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.tql-item{padding:.65rem 1.1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:.85rem;font-size:.88rem;transition:background .15s}
.tql-item:last-child{border:none}
.tql-item:hover{background:var(--s2)}
.tql-num{width:22px;height:22px;border-radius:50%;background:var(--bd2);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;font-family:var(--mono);flex-shrink:0}
.tql-done{background:var(--gnd);color:var(--grn)}
.tql-skip{background:var(--gd);color:var(--gold2)}
.tql-unanswered{background:var(--bd2);color:var(--t3)}

/* ── FORMULA SHEET ── */
.formula-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.formula-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.25rem;transition:all .2s}
.formula-card:hover{border-color:var(--bd2);background:var(--s2)}
.formula-topic{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:.65rem;display:flex;align-items:center;gap:.5rem}
.formula-item{display:flex;align-items:flex-start;gap:.75rem;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.formula-item:last-child{border:none}
.fi-name{font-size:.88rem;font-weight:600;color:var(--t2);min-width:100px;flex-shrink:0;line-height:1.4}
.fi-formula{font-family:var(--mono);font-size:.95rem;color:var(--teal);background:var(--s3);padding:.22rem .6rem;border-radius:4px;line-height:1.9;flex:1;word-break:break-word}
.formula-search{margin-bottom:1.25rem;position:relative}
.formula-search input{padding-left:2.5rem}
.fs-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.9rem;pointer-events:none}

/* ── NOTIFICATIONS ── */
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--rose);border-radius:50%;border:1.5px solid var(--bg);animation:pdot 2s ease-in-out infinite}
.notif-btn{position:relative;background:var(--s2);border:1px solid var(--bd2);color:var(--t2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;transition:all .2s;flex-shrink:0}
.notif-btn:hover{background:var(--s3)}
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:pgIn .2s ease}
.np-head{padding:.85rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.np-head h4{font-size:.97rem;font-weight:700}
.notif-item{padding:.75rem 1rem;border-bottom:1px solid var(--bd);transition:background .15s;cursor:pointer}
.notif-item:hover{background:var(--s3)}
.notif-item:last-child{border:none}
.ni-title{font-size:.88rem;font-weight:600;color:var(--t1);margin-bottom:2px}
.ni-body{font-size:.82rem;color:var(--t3);line-height:1.85}
.ni-time{font-size:.74rem;color:var(--t3);margin-top:3px;font-family:var(--mono)}
.ni-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* ── PROGRESS CHART in Accounts ── */
.prog-chart-wrap{height:220px;margin-top:.75rem}

/* ── LEADERBOARD ── */

.lb-row:hover{border-color:var(--bd2);background:var(--s2)}

.lb-info h4{font-size:.92rem;font-weight:600;color:var(--t1)}
.lb-info p{font-size:.78rem;color:var(--t3);margin-top:2px}

/* ── SEARCH RESULTS ── */
.sr-header{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.4rem;margin-bottom:1.4rem}
.sr-input-wrap{position:relative}
.sr-input{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rs);padding:.65rem 1rem .65rem 2.6rem;font-family:var(--font);font-size:.95rem;color:var(--t1);outline:none;width:100%;transition:border .18s}
.sr-input:focus{border-color:rgba(245,200,66,.5)}
.sr-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--t3)}
.sr-stats{font-size:.88rem;color:var(--t3);margin-top:.7rem}
.sr-stats span{color:var(--gold);font-weight:600;font-family:var(--mono)}
.sr-result{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rs);padding:1rem 1.2rem;margin-bottom:7px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.85rem}
.sr-result:hover{border-color:var(--bd2);background:var(--s2);transform:translateX(3px)}
.sr-type-icon{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.sr-body{flex:1}
.sr-title{font-size:.9rem;font-weight:600;color:var(--t1);margin-bottom:3px}
.sr-snippet{font-size:.85rem;color:var(--t3);line-height:1.85}
.sr-meta{display:flex;gap:6px;align-items:center;margin-top:5px}
.sr-tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:.15rem .42rem;border-radius:4px}
mark{background:rgba(245,200,66,.25);color:var(--gold2);border-radius:2px;padding:0 2px}

/* ── CONTACT / SUPPORT ── */
.contact-grid{display:grid;grid-template-columns:1fr 380px;gap:1.4rem;align-items:start}
.faq-item{border-bottom:1px solid var(--bd)}
.faq-q{padding:.85rem 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--t1);transition:color .15s}
.faq-q:hover{color:var(--gold)}
.faq-a{padding-bottom:.85rem;font-size:.88rem;color:var(--t3);line-height:1.9}
.faq-chevron{font-size:.88rem;color:var(--t3);transition:transform .2s;flex-shrink:0}
.faq-item.open .faq-chevron{transform:rotate(180deg);color:var(--gold)}

/* ── GDPR CONSENT BANNER ── */
.gdpr-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:10000;
  background:var(--s2);border-top:1px solid var(--bd2);
  padding:1.1rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  flex-wrap:wrap;
  box-shadow:0 -4px 24px rgba(0,0,0,.4);
  animation:slideUp .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.gdpr-text{font-size:.88rem;color:var(--t2);line-height:1.75;flex:1;min-width:240px}
.gdpr-text a{color:var(--gold);text-decoration:none;font-weight:600}
.gdpr-btns{display:flex;gap:7px;flex-shrink:0}

/* ── KEYBOARD SHORTCUTS MODAL ── */
.ks-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;display:flex;align-items:center;justify-content:center}
.ks-modal{background:var(--s2);border:1px solid var(--bd2);border-radius:18px;padding:2rem;width:440px;max-width:90vw;animation:pgIn .25s ease}
.ks-title{font-size:.97rem;font-weight:700;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
.ks-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ks-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem .6rem;background:var(--s3);border-radius:var(--rs)}
.ks-key{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--t1);background:var(--s4);padding:.16rem .4rem;border-radius:4px;border:1px solid var(--bd2)}
.ks-desc{font-size:.88rem;color:var(--t3)}

/* ── MOBILE BOTTOM NAV ── */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:rgba(12,17,32,.95);
  border-top:1px solid var(--bd);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom,0px));
  flex-direction:row;
  justify-content:space-around;
}
@media(max-width:640px){.bottom-nav{display:flex}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;padding:.2rem 0;transition:all .17s}
.bn-ico{font-size:1.45rem;line-height:1}
.bn-lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);transition:color .15s}
.bn-item.on .bn-lbl{color:var(--gold)}
.bn-item.on .bn-ico{filter:drop-shadow(0 0 6px var(--gold))}
@media(max-width:640px){body{padding-bottom:65px}}

/* ── LOADING SCREEN ── */
.loading-screen{
  position:fixed;inset:0;background:var(--bg);z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
}
.ls-logo{font-size:2.4rem;font-weight:900;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.ls-icon{width:56px;height:50px;display:flex;align-items:center;justify-content:center;animation:lsIcon 1.5s ease-in-out infinite}
@keyframes lsIcon{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(-5deg)}}
.ls-bar{width:220px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.ls-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:2px;animation:lsFill 1.8s ease forwards}
@keyframes lsFill{from{width:0}to{width:100%}}
.ls-text{font-size:.78rem;color:var(--t3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;animation:lsText 1.5s ease-in-out infinite}
@keyframes lsText{0%,100%{opacity:.4}50%{opacity:1}}
.ls-facts{font-size:.95rem;color:var(--t2);font-style:italic;font-family:var(--serif);text-align:center;max-width:340px;line-height:1.9}
.loading-screen.hide{animation:lsHide .5s ease .5s forwards}
@keyframes lsHide{to{opacity:0;pointer-events:none}}

/* ── TOPIC PROGRESS BADGE ON SIDEBAR ── */
.topic-prog{display:flex;align-items:center;gap:5px}
.tp-bar{width:32px;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.tp-fill{height:100%;border-radius:2px;background:var(--teal)}

/* ── BOOKMARK BUTTON ── */
.bk-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:1.15rem;padding:.2rem .35rem;border-radius:4px;transition:all .17s;flex-shrink:0}
.bk-btn:hover{color:var(--gold);background:var(--gd)}
.bk-btn.saved{color:var(--gold)}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<!-- Loading screen -->

function reducer(state,action){
  switch(action.type){
    case 'QUIZ_CORRECT': return {...state,quizScore:{c:state.quizScore.c+1,t:state.quizScore.t+1}};
    case 'QUIZ_WRONG':   return {...state,quizScore:{...state.quizScore,t:state.quizScore.t+1}};
    case 'ADD_DOWNLOAD': {
      const fl = {"United Kingdom":"🇬🇧","Nigeria":"🇳🇬","Ghana":"🇬🇭","United States":"🇺🇸","Jamaica":"🇯🇲","South Africa":"🇿🇦","Kenya":"🇰🇪","India":"🇮🇳","Canada":"🇨🇦","Australia":"🇦🇺","Ireland":"🇮🇪","Pakistan":"🇵🇰","Zimbabwe":"🇿🇼","Other":"🌍"};
      const newId = state.downloads + 1;
      const newRow = {id:newId,school:action.school,country:action.country,flag:fl[action.country]||"🌍",date:"Just now",isNew:true};
      const newCd = {...state.countryData,[action.country]:(state.countryData[action.country]||0)+1};
      const existSch = state.schoolData.find(s=>s.school===action.school);
      const newSd = existSch
        ? state.schoolData.map(s=>s.school===action.school?{...s,count:s.count+1}:s)
        : [{school:action.school,country:action.country,flag:fl[action.country]||"🌍",count:1},...state.schoolData];
      return {...state,downloads:newId,trackerRows:[newRow,...state.trackerRows],countryData:newCd,schoolData:newSd};
    }
    default: return state;
  }
}

function Provider({children}){
  const [state,dispatch] = useReducer(reducer,initData);
  const answerQ = useCallback((ok)=>{
    dispatch({type:ok?'QUIZ_CORRECT':'QUIZ_WRONG'});

    }
  },[]);
  const addDownload = useCallback((school,country)=>{
    dispatch({type:'ADD_DOWNLOAD',school,country});
    showToast('Download started — enjoy the guide! 🎓');
  },[]);
  return <Ctx.Provider value={{...state,answerQ,addDownload}}>{children}</Ctx.Provider>;
}

/* ── TOAST ── */
function showToast(msg,type='gold'){
  const c=document.getElementById('toast-c');
  const el=document.createElement('div');
  el.className='toast';
  el.style.borderLeftColor=type==='rose'?'var(--rose)':type==='teal'?'var(--teal)':type==='vio'?'var(--vio)':'var(--gold)';
  el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('exit');setTimeout(()=>el.remove(),250);},3200);
}

/* ── COUNTDOWN HOOK ── */
function useCdown(target){
  const [t,setT]=useState({d:0,h:0,m:0,s:0});
  useEffect(()=>{
    const calc=()=>{const diff=target-Date.now();if(diff<=0)return{d:0,h:0,m:0,s:0};return{d:Math.floor(diff/(864e5)),h:Math.floor(diff%864e5/36e5),m:Math.floor(diff%36e5/6e4),s:Math.floor(diff%6e4/1e3)};};
    setT(calc());const id=setInterval(()=>setT(calc()),1000);return()=>clearInterval(id);
  },[target]);
  return t;
}

function MasteryRings({setPage}){

    {n:'Vectors',p:28,c:'#fb923c'},{n:'Prob',p:65,c:'#34d399'},
  ];
  const R=31,C=2*Math.PI*R;
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setAnim(true);},{threshold:.3});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return(
    <div className="mastery" ref={ref}>

            <div className="mr-ring">

            </div>
            <div className="mr-nm">{t.n}</div>
          </div>);
        })}

    </div>
  );
}

/* ── MCQ COMPONENT ── */
function MCQ({question,opts,correct,onAnswer}){
  const [sel,setSel]=useState(null);
  const handle=i=>{if(sel!==null)return;setSel(i);onAnswer(i===correct);};
  return(
    <div className="mcq-wrap">
      <div className="mcq-q">{question}</div>
      <div className="mcq-opts">
        {opts.map((o,i)=>{
          let cls='mcq-o';
          if(sel!==null){if(i===correct)cls+=' ok';else if(i===sel)cls+=' no';}
          return(<button key={i} className={cls} onClick={()=>handle(i)}><div className="opt-l">{String.fromCharCode(65+i)}</div>{o}</button>);
        })}
      </div>
      {sel!==null&&<div className={`mcq-fb ${sel===correct?'fb-ok':'fb-no'}`} style={{display:'block'}}>{sel===correct?'✓ Correct! Well done.':'✗ Not quite — review the worked solution.'}</div>}
    </div>
  );
}

/* ── QUESTION CARD ── */
function QCard({q}){
  const [open,setOpen]=useState(false);
  const {answerQ}=useContext(Ctx);
  const dm={'Easy':'diff-e','Medium':'diff-m','Hard':'diff-h'};
  const ecm={'gcse':'ec-gcse','al':'ec-al','fm':'ec-fm'};
  const ecl={'gcse':'GCSE','al':'A-Level','fm':'Further'};
  // Map topics to video playlist IDs
  const vidLinks={algebra:'gcse-algebra',geometry:'gcse-geo',stats:'gcse-geo',number:'gcse-algebra',calculus:q.exam==='fm'?'fm-core':'al-calculus',trig:'al-pure',complex:'fm-core',matrices:'fm-core'};

  // Render solution as numbered steps if it contains <br><br>
  const renderSolution=(sol)=>{
    if(!sol) return null;
    const steps=sol.split('<br><br>').filter(s=>s.trim());
    if(steps.length<=1) return <div className="sol-box" dangerouslySetInnerHTML={{__html:sol}}/>;
    return(
      <div className="sol-box">
        <div className="sol-steps">
          {steps.map((step,i)=>(
            <div className="sol-step" key={i}>
              <div className="step-num">{i+1}</div>
              <div className="step-text" dangerouslySetInnerHTML={{__html:step}}/>
            </div>
          ))}
        </div>
      </div>
    );
  };

  return(
    <div className={`qcard${open?' open':''}`} onClick={()=>setOpen(!open)}>
      <div className="qtop">
        <div className="qtext" dangerouslySetInnerHTML={{__html:q.text}}/>
        <div className="qmeta">
          <span className={`exam-chip ${ecm[q.exam]}`}>{ecl[q.exam]}</span>
          <span className={dm[q.diff]}>{q.diff}</span>
          <span className="qmarks">[{q.marks}m]</span>
        </div>
      </div>
      {open&&(
        <div className="qsol" onClick={e=>e.stopPropagation()}>
          {q.mcq?<MCQ question={q.mcqQ} opts={q.mcqOpts} correct={q.mcqC} onAnswer={answerQ}/>
            :renderSolution(q.solution)}
          <div className="sol-meta">{q.ms}</div>
          {vidLinks[q.topic]&&(
            <div className="q-vid-link" onClick={()=>showToast('Navigate to Videos → '+q.topic+' playlist for the solution video','teal')}>
              ▶ Watch solution video
            </div>
          )}
        </div>
      )}
    </div>
  );
}

    return[{id:'all',label:'All Topics',cnt:qs.length},...ts.map(t=>({id:t,label:t.charAt(0).toUpperCase()+t.slice(1),cnt:qs.filter(q=>q.topic===t).length}))];
  },[exam]);

  const examColors={'all':'var(--gold)','gcse':'var(--teal)','al':'var(--gold)','fm':'var(--vio)'};

  return(
    <div className="pw">
      <div className="sh"><h2>Question Bank</h2></div>

      <div className="exam-tabs stagger">
        {examTypes.map(e=>{
          const cls=`et${exam===e.id?` on-${e.id}`:''}`; 
          return(
            <div key={e.id} className={cls} onClick={()=>{setExam(e.id);setTopic('all');}}>
              {e.ecls&&<span className={`tag ${e.ecls}`} style={{margin:0,display:'block',marginBottom:6}}>{e.label}</span>}

        </div>
        <div style={{display:'flex',alignItems:'center',gap:'.68rem'}}>

          <ul className="qs-list">
            {topicsForExam.map(t=>{
              const cls=topic===t.id?`qi ${exam==='gcse'?'on-t':exam==='fm'?'on-v':'on'}`:'qi';
              return(<li key={t.id} className={cls} onClick={()=>setTopic(t.id)}>{t.label}<span className="qcount">{t.cnt}</span></li>);

          <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid var(--bd)'}}>

            </div>
          </div>
          <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid var(--bd)'}}>
            <div className="qs-h">Search</div>
            <input className="fi" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} onClick={e=>e.stopPropagation()}/>
          </div>
          {exam!=='all'&&(
            <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid var(--bd)',fontSize:'1.19rem',color:'var(--t3)',lineHeight:1.5}}>
              <div style={{fontWeight:700,color:examColors[exam],marginBottom:4}}>{examTypes.find(e=>e.id===exam)?.label}</div>
              {exam==='gcse'&&'Foundation & Higher tier questions, AQA / Edexcel / OCR'}
              {exam==='al'&&'Year 1 & Year 2 content, all major exam boards'}
              {exam==='fm'&&'Complex numbers, matrices, further calculus & statistics'}
            </div>
          )}
        </div>

        {/* Questions list */}
        <div>
          {filtered.length===0
            ?<div style={{textAlign:'center',padding:'3rem',color:'var(--t3)',fontSize:'1.36rem'}}>No questions match your filters.</div>
            :filtered.map(q=><QCard key={q.id} q={q}/>)
          }
        </div>
      </div>
    </div>
  );
}

function WeekBlk({w,open:init}){
  const [o,setO]=useState(init);
  return(<div className="week-blk"><div className="wk-h" onClick={()=>setO(!o)}><h4>{w.t}</h4><span className="wk-t">{o?'Collapse ↑':'Expand ↓'}</span></div>{o&&<div className="wk-days">{w.days.map((d,i)=><div className="dr" key={i}><span className="dr-d">{d.d}</span><span className="dr-t">{d.t}</span><span className="dr-h">{d.h}</span></div>)}</div>}</div>);
}

function DLBarChart(){
  const ref=useRef();const cr=useRef();
  useEffect(()=>{
    if(cr.current)cr.current.destroy();
    const ctx=ref.current.getContext('2d');
    cr.current=new Chart(ctx,{type:'bar',data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{label:'Downloads',data:[38,51,29,66,44,72,58],backgroundColor:['rgba(245,200,66,.7)','rgba(45,217,197,.7)','rgba(249,107,139,.6)','rgba(91,180,244,.7)','rgba(79,214,138,.7)','rgba(245,200,66,.85)','rgba(167,139,250,.7)'],borderColor:['#2EC4B6','#2dd9c5','#f96b8b','#5bb4f4','#4fd68a','#2EC4B6','#a78bfa'],borderWidth:1.5,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(12,17,32,.95)',titleColor:'#2EC4B6',bodyColor:'rgba(238,242,252,.8)',borderColor:'rgba(255,255,255,.1)',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(238,242,252,.4)',font:{size:10,family:"'JetBrains Mono',monospace"}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(238,242,252,.4)',font:{size:10,family:"'JetBrains Mono',monospace"}}}}}});
    return()=>cr.current?.destroy();
  },[]);
  return <canvas ref={ref} style={{width:'100%',height:'100%'}}/>;
}

/* ── MOCK EXAM TIMER ── */
function MockExam(){
  const [chosen,setChosen]=useState(null);
  const [running,setRunning]=useState(false);
  const [paused,setPaused]=useState(false);
  const [secs,setSecs]=useState(0);
  const [answers,setAnswers]=useState({});
  const iRef=useRef(null);

  const exams=[
    {id:'gcse-nc',title:'GCSE Non-Calculator',board:'AQA / Edexcel / OCR',duration:90,marks:80,qs:25,exam:'gcse'},
    {id:'gcse-c',title:'GCSE Calculator',board:'AQA / Edexcel / OCR',duration:90,marks:80,qs:25,exam:'gcse'},
    {id:'gcse-p3',title:'GCSE Paper 3 (Calculator)',board:'AQA',duration:90,marks:80,qs:25,exam:'gcse'},
    {id:'al-p1',title:'A-Level Paper 1 Pure',board:'AQA / Edexcel',duration:120,marks:100,qs:14,exam:'al'},
    {id:'al-p2',title:'A-Level Paper 2 Pure',board:'AQA / Edexcel',duration:120,marks:100,qs:14,exam:'al'},
    {id:'al-p3',title:'A-Level Stats & Mechanics',board:'Edexcel',duration:120,marks:100,qs:12,exam:'al'},
    {id:'fm-cp1',title:'Further Maths Core Pure 1',board:'Edexcel',duration:90,marks:75,qs:10,exam:'fm'},
    {id:'fm-cp2',title:'Further Maths Core Pure 2',board:'Edexcel',duration:90,marks:75,qs:10,exam:'fm'},
  ];

  const selected=exams.find(e=>e.id===chosen);
  const totalSecs=selected?selected.duration*60:0;
  const remaining=Math.max(0,totalSecs-secs);
  const pct=totalSecs?Math.round(remaining/totalSecs*100):100;
  const isWarn=remaining<300&&remaining>0&&running;
  const circumference=2*Math.PI*80;

  useEffect(()=>{
    if(running&&!paused){
      iRef.current=setInterval(()=>setSecs(s=>{
        if(s>=totalSecs){clearInterval(iRef.current);setRunning(false);showToast('⏰ Time is up!','rose');return totalSecs;}
        return s+1;
      }),1000);
    }
    return()=>clearInterval(iRef.current);
  },[running,paused,totalSecs]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const start=()=>{setSecs(0);setRunning(true);setPaused(false);setAnswers({});showToast('Exam started — good luck! 🎯');};
  const togglePause=()=>setPaused(p=>{showToast(p?'Resumed ▶':'Paused ⏸');return!p;});
  const finish=()=>{clearInterval(iRef.current);setRunning(false);const d=Object.values(answers).filter(a=>a==='done').length;showToast(`Finished — ${d}/${selected?.qs||0} attempted 📝`);};

  const mockQs=useMemo(()=>selected?Array.from({length:selected.qs},(_,i)=>({n:i+1,marks:[4,3,2,5,6,3,4,2,3,4,5,2,3,6][i%14]||3})):[],[selected]);
  const qDone=Object.values(answers).filter(a=>a==='done').length;
  const qSkip=Object.values(answers).filter(a=>a==='skip').length;

  return(
    <div className="pw">
      <div className="sh"><h2>Mock Exam Mode</h2></div>
      {!chosen&&(
        <>
          <div className="ai-b"><div className="ai-ico">⏱</div><div><div className="ai-tt">Timed Mock Exam</div><div className="ai-st">Choose a paper type below. The timer runs in real-time and you can track which questions you've answered.</div></div></div>
          <div className="exam-select-grid stagger">
            {exams.map(e=>(
              <div key={e.id} className="exam-sel-card" onClick={()=>setChosen(e.id)}>
                <span className={`exam-chip ${e.exam==='gcse'?'ec-gcse':e.exam==='fm'?'ec-fm':'ec-al'}`} style={{fontSize:'1.19rem',marginBottom:6,display:'inline-block'}}>{e.exam==='gcse'?'GCSE':e.exam==='fm'?'Further Maths':'A-Level'}</span>
                <div className="exam-sel-title">{e.title}</div>
                <div className="exam-sel-meta">{e.board} · {e.duration} min · {e.marks} marks</div>
              </div>
            ))}
          </div>
        </>
      )}
      {chosen&&(
        <>
          <button className="btn btn-ghost btn-sm" style={{marginBottom:'1rem'}} onClick={()=>{setChosen(null);setRunning(false);clearInterval(iRef.current);setSecs(0);}}>← Change paper</button>
          <div className="timer-card">
            <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:'.75rem'}}>
              <span className={`exam-chip ${chosen.startsWith('gcse')?'ec-gcse':chosen.startsWith('fm')?'ec-fm':'ec-al'}`}>{selected?.title}</span>
            </div>
            <div style={{position:'relative',width:190,height:190,margin:'0 auto'}}>
              <svg width="190" height="190" viewBox="0 0 190 190" style={{transform:'rotate(-90deg)'}}>
                <circle cx="95" cy="95" r="80" fill="none" stroke="var(--s3)" strokeWidth="10"/>
                <circle cx="95" cy="95" r="80" fill="none"
                  stroke={isWarn?'var(--rose)':remaining<600?'var(--gold)':'var(--teal)'}
                  strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={circumference}
                  strokeDashoffset={circumference*(1-pct/100)}
                  style={{transition:'stroke-dashoffset .5s ease,stroke .3s'}}
                />
              </svg>
              <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
                <div className={`timer-display${isWarn?' warn':''}`} style={{fontSize:'3.55rem',margin:0,lineHeight:1}}>{fmt(remaining)}</div>
                <div style={{fontSize:'1.28rem',color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.1em',marginTop:3}}>remaining</div>
              </div>
            </div>
            <div style={{maxWidth:320,margin:'.75rem auto 0'}}>
              <div style={{height:4,background:'var(--bd)',borderRadius:2,overflow:'hidden'}}>
                <div style={{height:'100%',background:isWarn?'var(--rose)':'var(--teal)',width:`${pct}%`,borderRadius:2,transition:'width .5s ease,background .3s'}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:'1.07rem',color:'var(--t3)',marginTop:4}}>
                <span>{fmt(secs)} elapsed</span><span>{pct}% remaining</span>
              </div>
            </div>
            <div className="timer-controls">
              {!running&&<button className="btn btn-gold" onClick={start}>▶ Start Timer</button>}
              {running&&<button className="btn btn-ghost" onClick={togglePause}>{paused?'▶ Resume':'⏸ Pause'}</button>}
              {running&&<button className="btn btn-rose" onClick={finish}>■ End Exam</button>}
            </div>
          </div>
          <div className="timer-q-list">
            <div className="tql-head">
              <span>Question Tracker — {selected?.qs} questions, {selected?.marks} marks</span>
              <span style={{fontSize:'1.06rem',color:'var(--t3)'}}>{qDone} done · {qSkip} skipped · {mockQs.length-qDone-qSkip} remaining</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))'}}>
              {mockQs.map(q=>(
                <div className="tql-item" key={q.n}>
                  <div className={`tql-num${answers[q.n]==='done'?' tql-done':answers[q.n]==='skip'?' tql-skip':''}`}>{q.n}</div>
                  <span style={{flex:1,fontSize:'1.12rem',color:'var(--t2)'}}>Q{q.n}</span>
                  <span style={{fontSize:'1.12rem',color:'var(--t3)',fontFamily:'var(--mono)',marginRight:6}}>{q.marks}m</span>
                  <div style={{display:'flex',gap:4}}>
                    <button className="btn btn-sm" style={{fontSize:'1.16rem',padding:'.15rem .45rem',background:'var(--gnd)',color:'var(--grn)',border:'1px solid rgba(79,214,138,.2)'}} onClick={()=>setAnswers(a=>({...a,[q.n]:'done'}))}>✓ Done</button>
                    <button className="btn btn-sm" style={{fontSize:'1.16rem',padding:'.15rem .45rem',background:'var(--gd)',color:'var(--gold2)',border:'1px solid rgba(245,200,66,.2)'}} onClick={()=>setAnswers(a=>({...a,[q.n]:'skip'}))}>Skip</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

  const sections=[

function SearchResults({query,setPage}){
  const [q,setQ]=useState(query||'');
  const [typeFilter,setTypeFilter]=useState('all');

  // Searchable content index
  const index=[
    // Questions
    ...ALL_QUESTIONS.map(qu=>({type:'question',title:`Q${qu.id}: ${qu.text.replace(/<[^>]+>/g,'')}`,snippet:qu.solution?qu.solution.replace(/<[^>]+>/g,'').slice(0,100)+'…':'',tags:[qu.exam==='gcse'?'GCSE':qu.exam==='al'?'A-Level':'Further Maths',qu.topic,qu.diff],page:'questions',color:'var(--teal)',icon:'📝'})),
    // Papers
    {type:'paper',title:'AQA GCSE Maths — Paper 1 Non-Calculator 2024',snippet:'June 2024 · 80 marks · 1h 30min · Higher Tier',tags:['Paper','GCSE','AQA','2024'],page:'papers',color:'var(--gold)',icon:'📄'},
    {type:'paper',title:'Edexcel A-Level Pure Mathematics 1 2024',snippet:'June 2024 · 100 marks · 2h · A-Level Pure',tags:['Paper','A-Level','Edexcel','2024'],page:'papers',color:'var(--gold)',icon:'📄'},
    {type:'paper',title:'AQA Further Maths Core Pure 1 2024',snippet:'June 2024 · 75 marks · 1h 30min · Further Maths',tags:['Paper','Further Maths','AQA','2024'],page:'papers',color:'var(--gold)',icon:'📄'},
    // Formulas
    {type:'formula',title:'Quadratic Formula',snippet:'x = (−b ± √(b²−4ac)) / 2a',tags:['Formula','GCSE','Algebra'],page:'formulae',color:'var(--vio)',icon:'📐'},
    {type:'formula',title:'Integration by Parts',snippet:'∫u dv = uv − ∫v du',tags:['Formula','A-Level','Calculus'],page:'formulae',color:'var(--vio)',icon:'📐'},
    {type:'formula',title:"De Moivre's Theorem",snippet:'(re^(iθ))ⁿ = rⁿ(cos nθ + i sin nθ)',tags:['Formula','Further Maths','Complex'],page:'formulae',color:'var(--vio)',icon:'📐'},
    // Videos
    {type:'video',title:'Solving Quadratics — All Methods',snippet:'GCSE Algebra playlist · 18:42 · Most watched video',tags:['Video','GCSE','Algebra'],page:'videos',color:'var(--rose)',icon:'🎬'},
    {type:'video',title:'Circle Theorems — Complete Guide',snippet:'GCSE Geometry playlist · 22:15',tags:['Video','GCSE','Geometry'],page:'videos',color:'var(--rose)',icon:'🎬'},
    {type:'video',title:'Integration by Parts Walkthrough',snippet:'A-Level Calculus playlist · 24:30',tags:['Video','A-Level','Calculus'],page:'videos',color:'var(--rose)',icon:'🎬'},
    {type:'video',title:"De Moivre's Theorem Explained",snippet:'Further Maths playlist · 26:15',tags:['Video','Further Maths','Complex'],page:'videos',color:'var(--rose)',icon:'🎬'},
    // Flashcards
    {type:'flashcard',title:'Flashcard: Quadratic Formula',snippet:'Flip to see: x = (−b ± √(b²−4ac)) / 2a',tags:['Flashcard','GCSE','Algebra'],page:'flashcards',color:'var(--grn)',icon:'🃏'},
    {type:'flashcard',title:'Flashcard: Pythagorean Identity',snippet:'Flip to see: sin²θ + cos²θ = 1',tags:['Flashcard','A-Level','Trig'],page:'flashcards',color:'var(--grn)',icon:'🃏'},
    // Shop
    {type:'resource',title:'GCSE Maths Complete Revision Guide',snippet:'240 pages · All Higher tier topics · £9.99',tags:['Shop','GCSE','Book'],page:'shop',color:'var(--amber)||var(--gold)',icon:'📚'},
    {type:'resource',title:'A-Level Maths Revision Workbook',snippet:'Year 1 & 2 Pure, Stats, Mechanics · £12.99',tags:['Shop','A-Level','Book'],page:'shop',color:'var(--gold)',icon:'📚'},
  ];

  const bgColors={'question':'var(--td)','paper':'var(--gd)','formula':'var(--vd)','video':'var(--rd)','flashcard':'var(--gnd)','resource':'var(--gd2)'};

  const filtered=useMemo(()=>{
    if(!q.trim())return[];
    const lq=q.toLowerCase();
    return index.filter(item=>{
      if(typeFilter!=='all'&&item.type!==typeFilter)return false;
      return item.title.toLowerCase().includes(lq)||item.snippet.toLowerCase().includes(lq)||item.tags.some(t=>t.toLowerCase().includes(lq));
    }).slice(0,20);
  },[q,typeFilter]);

  const highlight=(text)=>{
    if(!q.trim())return text;
    const parts=text.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'));
    return parts.map((p,i)=>p.toLowerCase()===q.toLowerCase()?React.createElement('mark',{key:i},p):p);
  };

  const typeCounts=useMemo(()=>{
    if(!q.trim())return {};
    const lq=q.toLowerCase();
    const all=index.filter(i=>i.title.toLowerCase().includes(lq)||i.snippet.toLowerCase().includes(lq)||i.tags.some(t=>t.toLowerCase().includes(lq)));
    const counts={};
    all.forEach(i=>counts[i.type]=(counts[i.type]||0)+1);
    return counts;
  },[q]);

  return(
    <div className="pw">
      <div className="sh"><h2>Search</h2></div>
      <div className="sr-header">
        <div className="sr-input-wrap">
          <span className="sr-icon">🔍</span>
          <input className="sr-input" placeholder="Search questions, formulas, papers, videos…" value={q} onChange={e=>setQ(e.target.value)} autoFocus/>
        </div>
        {filtered.length>0&&<div className="sr-stats">Found <span>{filtered.length}</span> results for "<span>{q}</span>"</div>}
      </div>

      {q.trim()&&(
        <div className="fbar">
          <button className={`fb${typeFilter==='all'?' on':''}`} onClick={()=>setTypeFilter('all')}>All ({Object.values(typeCounts).reduce((a,b)=>a+b,0)})</button>
          {Object.entries(typeCounts).map(([t,n])=>(
            <button key={t} className={`fb${typeFilter===t?' on':''}`} onClick={()=>setTypeFilter(t)}>
              {t==='question'?'📝':t==='paper'?'📄':t==='formula'?'📐':t==='video'?'🎬':t==='flashcard'?'🃏':'📚'} {t.charAt(0).toUpperCase()+t.slice(1)}s ({n})
            </button>
          ))}
        </div>
      )}

      {!q.trim()&&(
        <div style={{textAlign:'center',padding:'3rem',color:'var(--t3)'}}>
          <div style={{fontSize:'3.1rem',marginBottom:'.75rem'}}>🔍</div>
          <div style={{fontSize:'1.97rem',fontWeight:600,marginBottom:'.4rem',color:'var(--t2)'}}>Search across everything</div>
          <div style={{fontSize:'1.27rem',lineHeight:1.7}}>Questions, formulas, past papers, video solutions, flashcards, resources</div>
        </div>
      )}

      {q.trim()&&filtered.length===0&&(
        <div style={{textAlign:'center',padding:'3rem',color:'var(--t3)'}}>
          <div style={{fontSize:'3.15rem',marginBottom:'.6rem'}}>😕</div>
          <div style={{fontSize:'1.22rem',color:'var(--t2)',marginBottom:'.35rem'}}>No results for "{q}"</div>
          <div style={{fontSize:'1.97rem'}}>Try searching for a topic, formula name, or paper year</div>
        </div>
      )}

      {filtered.map((r,i)=>(
        <div className="sr-result" key={i} onClick={()=>setPage(r.page)}>
          <div className="sr-type-icon" style={{background:bgColors[r.type]}}>{r.icon}</div>
          <div className="sr-body">
            <div className="sr-title">{highlight(r.title)}</div>
            <div className="sr-snippet">{highlight(r.snippet)}</div>
            <div className="sr-meta">
              {r.tags.map(t=>(
                <span key={t} className="sr-tag" style={{background:'var(--bd2)',color:'var(--t3)'}}>{t}</span>
              ))}
              <span style={{fontSize:'1.28rem',color:'var(--sky)',marginLeft:'auto',fontWeight:600}}>Go to {r.page} →</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

          <div className="card" style={{background:'var(--gd)'}}>
            <div style={{fontSize:'1.22rem',fontWeight:700,color:'var(--gold2)',marginBottom:'.5rem'}}>📣 Advertise with us</div>
            <p style={{fontSize:'1.27rem',color:'var(--t3)',lineHeight:1.6,marginBottom:'.8rem'}}>List your revision guide, question pack, or educational resource on Mathsora. Reach thousands of maths students monthly.</p>
            <button className="btn btn-gold btn-sm" onClick={()=>setForm(f=>({...f,subject:'Advertise — List My Resource'}))}>
              Get Started →
            </button>
          </div>

          <div className="card">
            <div style={{fontSize:'1.22rem',fontWeight:700,marginBottom:'.5rem'}}>⚡ Response Times</div>
            {[['General enquiries','1–2 business days'],['Error reports','Same day (critical)'],['GDPR requests','Within 30 days (legal)'],['Partnership','3–5 business days']].map(([t,v],i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'.42rem 0',borderBottom:'1px solid var(--bd)',fontSize:'1.97rem'}}>
                <span style={{color:'var(--t2)'}}>{t}</span>
                <span style={{color:'var(--teal)',fontWeight:600,fontFamily:'var(--mono)'}}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── GDPR CONSENT BANNER ── */
function GDPRBanner(){
  const [visible,setVisible]=useState(()=>!localStorage.getItem('gdpr-consent'));
  if(!visible)return null;
  const accept=()=>{try{localStorage.setItem('gdpr-consent','1');}catch(e){}setVisible(false);showToast('Preferences saved ✓');};
  const decline=()=>{setVisible(false);};
  return(
    <div className="gdpr-banner">
      <div className="gdpr-text">
        🍪 We use anonymised analytics to improve Mathsora. We only collect school names and countries from resource downloads — no personal data. <a onClick={()=>showToast('Privacy Policy — add your policy page here')} style={{cursor:'pointer'}}>Privacy Policy</a>
      </div>
      <div className="gdpr-btns">
        <button className="btn btn-ghost btn-sm" onClick={decline}>Decline</button>
        <button className="btn btn-gold btn-sm" onClick={accept}>Accept</button>
      </div>
    </div>
  );
}

/* ── KEYBOARD SHORTCUTS MODAL ── */
function KeyboardShortcuts({setPage,onClose}){
  const shortcuts=[
    {key:'H',desc:'Go Home'},
    {key:'Q',desc:'Questions'},
    {key:'P',desc:'Past Papers'},
    {key:'V',desc:'Videos'},
    {key:'F',desc:'Flashcards'},
    {key:'M',desc:'Mock Exam'},
    {key:'/',desc:'Search'},
    {key:'?',desc:'Shortcuts'},
    {key:'Esc',desc:'Close modal'},
  ];
  return(
    <div className="ks-overlay" onClick={onClose}>
      <div className="ks-modal" onClick={e=>e.stopPropagation()}>
        <div className="ks-title">
          <span>⌨️ Keyboard Shortcuts</span>
          <button style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:'1.36rem'}} onClick={onClose}>✕</button>
        </div>
        <div className="ks-grid">
          {shortcuts.map(s=>(
            <div className="ks-row" key={s.key}>
              <span className="ks-desc">{s.desc}</span>
              <span className="ks-key">{s.key}</span>
            </div>
          ))}
        </div>
        <div style={{fontSize:'1.19rem',color:'var(--t3)',marginTop:'1rem',textAlign:'center'}}>Press any key to dismiss</div>
      </div>
    </div>
  );
}

/* ── BOTTOM MOBILE NAV ── */
function BottomNav({page,setPage}){
  const tabs=[
    {id:'home',ico:'🏠',lbl:'Home'},
    {id:'questions',ico:'📚',lbl:'Questions'},
    {id:'flashcards',ico:'🃏',lbl:'Cards'},
    {id:'planner',ico:'📅',lbl:'Planner'},
  ];
  return(
    <div className="bottom-nav">
      {tabs.map(t=>(
        <div key={t.id} className={`bn-item${page===t.id?' on':''}`} onClick={()=>setPage(t.id)}>
          <div className="bn-ico">{t.ico}</div>
          <div className="bn-lbl">{t.lbl}</div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [page,setPage]=useState('home');
  const [showShortcuts,setShowShortcuts]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');

  // Keyboard shortcuts
  useEffect(()=>{
    const handler=(e)=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      const map={h:'home',q:'questions',p:'papers',v:'videos',f:'flashcards',m:'mockexam'};
      if(e.key==='?'){setShowShortcuts(s=>!s);return;}
      if(e.key==='Escape'){setShowShortcuts(false);return;}
      if(e.key==='/'){setPage('search');return;}
      const dest=map[e.key.toLowerCase()];
      if(dest){setPage(dest);showToast(`Navigated to ${dest.charAt(0).toUpperCase()+dest.slice(1)} ⌨️`);}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  const goSearch=(q)=>{setSearchQuery(q||'');setPage('search');};

  const pages={
    home:<Home setPage={setPage} goSearch={goSearch}/>,
    questions:<Questions/>,
    papers:<Papers/>,
    videos:<Videos/>,
    book:<Resources/>,
    upload:<Upload/>,
    data:<DataPage/>,
    shop:<Shop setPage={setPage}/>,
    planner:<Planner/>,
    flashcards:<Flashcards/>,
    mockexam:<MockExam/>,
    formulae:<Formulae/>,
    search:<SearchResults query={searchQuery} setPage={setPage}/>,
    contact:<Contact/>,
    admin:<Admin/>,
  };

  return(
    <Provider>
      <Nav page={page} setPage={setPage} goSearch={goSearch}/>
      {pages[page]||<Home setPage={setPage} goSearch={goSearch}/>}
      <Footer setPage={setPage}/>
      <BottomNav page={page} setPage={setPage}/>
      <GDPRBanner/>
      {showShortcuts&&<KeyboardShortcuts setPage={setPage} onClose={()=>setShowShortcuts(false)}/>}
      <div style={{position:'fixed',bottom:'4.5rem',left:'1.2rem',zIndex:200,display:'flex',alignItems:'center',gap:5,fontSize:'1.12rem',color:'var(--t4)',fontFamily:'var(--mono)',cursor:'pointer',transition:'color .2s'}}
        onMouseEnter={e=>e.currentTarget.style.color='var(--t3)'}
        onMouseLeave={e=>e.currentTarget.style.color='var(--t4)'}
        onClick={()=>setShowShortcuts(true)}>
        <span style={{background:'var(--s3)',border:'1px solid var(--bd2)',padding:'.15rem .4rem',borderRadius:4}}>?</span>
        <span>shortcuts</span>
      </div>
    </Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
